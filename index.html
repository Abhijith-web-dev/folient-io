<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folient — Free Open-Source AI Portfolio Builder</title>
    
    <!-- Technical SEO Metadata -->
    <meta name="description" content="Build premium, high-performance portfolios and developer resumes with Folient, the free open-source AI portfolio builder. Connect Google Gemini or Groq to compile interactive bento grids and code showcases with zero backend architecture." />
    <meta name="keywords" content="AI portfolio builder, developer resume generator, open source portfolio, free portfolio builder, bento grid portfolio, developer portfolio, react portfolio creator, google gemini portfolio" />
    <meta name="author" content="Folient Community" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://folient.dev" />
    <meta name="theme-color" content="#F4F5F8" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://folient.dev" />
    <meta property="og:title" content="Folient — Free Open-Source AI Portfolio Builder" />
    <meta property="og:description" content="Build premium, high-performance portfolios and developer resumes with Folient. Compile interactive layouts and bento grids with zero backend." />
    <meta property="og:image" content="https://folient.dev/crystal.png" />
    <meta property="og:site_name" content="Folient" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://folient.dev" />
    <meta name="twitter:title" content="Folient — Free Open-Source AI Portfolio Builder" />
    <meta name="twitter:description" content="Build premium, high-performance portfolios and developer resumes with Folient. Compile interactive layouts and bento grids with zero backend." />
    <meta name="twitter:image" content="https://folient.dev/crystal.png" />

    <!-- Performance: Preconnect & Preload Fonts/Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Instrument+Serif:ital,wght@0,400;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Structured Data: JSON-LD Schema Markup -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Folient",
        "alternateName": "Folient Portfolio Builder",
        "description": "A free open-source AI-powered portfolio and developer resume builder with zero backend architecture, direct Supabase/Firebase integrations, and netlify/vercel deployment support.",
        "url": "https://folient.dev",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Zero-Backend Architecture",
          "AI-driven Portfolio Generation",
          "Local Browser Sandbox API encryption",
          "Direct Vercel & Netlify Deployment",
          "Code Blocks Editor",
          "Supabase Asset Vault Storage"
        ]
      }
    </script>
  </head>
  <body class="bg-[#F4F5F8] text-[#111111] antialiased overflow-x-hidden transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
